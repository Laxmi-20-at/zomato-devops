apiVersion: apps/v1
kind: Deployment
metadata:
  name: food-service
  namespace: staging
spec:
  replicas: 2

  selector:
    matchLabels:
      app: food-service

  template:
    metadata:
      labels:
        app: food-service

    spec:

      containers:
      - name: food-service

        image: 508716860773.dkr.ecr.ap-south-1.amazonaws.com/zomato-food-service:latest

        ports:
        - containerPort: 3000

        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"

          limits:
            cpu: "500m"
            memory: "512Mi"

        readinessProbe:
          httpGet:
            path: /health
            port: 3000

        livenessProbe:
          httpGet:
            path: /health
            port: 3000

---

apiVersion: v1
kind: Service
metadata:
  name: food-service
  namespace: staging

spec:

  selector:
    app: food-service

  ports:
  - port: 3000
    targetPort: 3000

  type: ClusterIP
