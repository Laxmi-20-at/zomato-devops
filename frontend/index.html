<!DOCTYPE html>
<html>
<head>

<title>Zomato DevOps Demo</title>

<style>

body {
    font-family: Arial;
    background: #f5f5f5;
    margin: 0;
}

header {
    background: #e23744;
    color: white;
    padding: 25px;
    text-align: center;
}

.container {
    width: 80%;
    margin: 30px auto;
}

.card {
    background: white;
    padding: 20px;
    margin: 15px;
    border-radius: 10px;
    box-shadow: 0 2px 10px #ccc;
}

button {
    background: #e23744;
    color: white;
    border: none;
    padding: 12px 20px;
    border-radius: 5px;
}

</style>

</head>

<body>

<header>

<h1>Food Delivery Platform</h1>

<p>Place and manage your food oders</p>

</header>

<div class="container">

<div class="card">

<h2>Food Service</h2>

<button onclick="getFoods()">
Load Food Menu
</button>

<div id="foods"></div>

</div>

<div class="card">

<h2>Order Service</h2>

<button onclick="placeOrder()">
Place Demo Order
</button>

<div id="order"></div>

</div>

</div>

<script>

async function getFoods() {

    const response = await fetch("/api/foods");

    const data = await response.json();

    document.getElementById("foods").innerHTML =
        data.map(food =>
            `<p>${food.name} - ₹${food.price}</p>`
        ).join("");

}

async function placeOrder() {

    const response = await fetch("/api/orders", {

        method: "POST",

        headers: {
            "Content-Type": "application/json"
        },

        body: JSON.stringify({
            customer: "Demo User",
            food: "Veg Biryani"
        })

    });

    const data = await response.json();

    document.getElementById("order").innerHTML =
        `<p>Order #${data.id} - ${data.status}</p>`;

}

</script>

</body>

</html>
